services:
  web:
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./pages:/app/pages
      - ./inventory:/app/inventory
      - ./files:/app/files
      - ./glaciers:/app/glaciers
      - ./landslidescience:/app/landslidescience
      - ./manage.py:/app/manage.py
      - ./tools:/app/tools
      # NOTE: to serve the lidar archive COGs in dev (/lidar/cog/<id>.tif),
      # add this line locally — it is deliberately NOT committed, because the
      # external volume is not always attached and a missing bind-mount source
      # makes `docker compose up` fail outright:
      #   - /Volumes/Nunatak/lidar_build/cog:/app/data/lidar/cog:ro
      # Without it the route 404s, which is also what prod does until the COGs
      # are moved to object storage.
    networks:
      - default
      - tethys_internal
    command: python manage.py runserver 0.0.0.0:8000

networks:
  # Joins the local Tethys stack's internal network so the inventory app can
  # reach tethys_db via Docker DNS (host=tethys_db). Requires the local Tethys
  # stack to be running. If it's not, /inventory/* will 502 but the rest of
  # the site (homepage, /tracyarm2025/, /admin/) still works.
  tethys_internal:
    name: tethys-timescale-grafana_internal
    external: true
